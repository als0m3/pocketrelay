services:
  pocketrelay:
    build: .
    # The CLIs bundled by the Dockerfile target Linux x86_64.
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    environment:
      POCKETRELAY_ENABLE_SESSIONS: "0"
      POCKETRELAY_SYSTEM_ACCOUNTS: ""
      POCKETRELAY_V1_ALLOW_MASTER: "0"
      POCKETRELAY_ALLOWED_HOSTS: "pocketrelay,${POCKETRELAY_ALLOWED_HOSTS:-${REMOTE_ALLOWED_HOSTS:-localhost}}"
      POCKETRELAY_PUBLIC_URL: "${POCKETRELAY_PUBLIC_URL:-${REMOTE_PUBLIC_URL:-}}"
      POCKETRELAY_HTTPS: "${POCKETRELAY_HTTPS:-${REMOTE_HTTPS:-0}}"
    volumes:
      - remote-data:/data
    healthcheck:
      test: ["CMD", "pocketrelay", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  remote-data:
