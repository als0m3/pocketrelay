apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: custom-remote
  annotations:
    description: OpenAI-compatible subscription gateway via CLI, token console, Open WebUI OIDC SSO and LiteLLM gateway
parameters:
  - name: IMAGE
    required: true
  - name: OPENWEBUI_IMAGE
    value: ghcr.io/open-webui/open-webui:v0.11.4
  - name: API_HOST
    description: Internal gateway route hostname (/admin console and /v1)
    required: true
  - name: CHAT_HOST
    description: Internal Open WebUI route hostname
    required: true
  - name: PUBLIC_API_HOST
    description: Public gateway hostname behind the VPS reverse proxy
    required: true
  - name: PUBLIC_CHAT_HOST
    description: Public Open WebUI hostname behind the VPS reverse proxy
    required: true
  - name: LITELLM_HOST
    description: Internal LiteLLM route hostname
    required: true
  - name: PUBLIC_LITELLM_HOST
    description: Public LiteLLM hostname behind the VPS proxy; UI blocked by relay.conf
    required: true
  - name: OIDC_ISSUER
    description: "Issuer OIDC, ex. https://keycloak.example/auth/realms/xxx"
    required: true
  - name: OIDC_CLIENT_ID
    required: true
  - name: OIDC_PROVIDER_NAME
    value: SSO
  - name: ADMIN_EMAILS
    description: Allowed /admin email addresses, comma-separated
    value: ""
  - name: ADMIN_GROUPS
    description: Allowed /admin Keycloak groups or roles, comma-separated
    value: ""
  - name: ACCESS_ROLE
    description: Keycloak role required for Open WebUI access
    value: relay_access
  - name: ADMIN_ROLE
    description: Keycloak role granting Open WebUI administration
    value: relay_admin
  - name: ROLES_CLAIM
    description: Token claim containing roles (Keycloak mapper)
    value: roles
  - name: USER_RATE
    description: Per-user /v1 rate (e.g. 200/h, 0 = unlimited; administrators exempt)
    value: 200/h
  - name: MAX_CONCURRENCY
    description: Maximum concurrent model requests; additional requests are queued
    value: "6"
  - name: DEFAULT_MODEL
    value: sonnet
  - name: TASK_MODEL
    description: Model for Open WebUI background tasks (titles, tags, suggestions)
    value: haiku
  - name: LITELLM_IMAGE
    value: ghcr.io/berriai/litellm:main-stable
  - name: POSTGRES_IMAGE
    description: "LiteLLM PostgreSQL image (sclorg, compatible with arbitrary OpenShift UIDs)"
    value: quay.io/sclorg/postgresql-16-c9s:latest
objects:
  # ---------- passerelle ----------
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: claude-api-data, labels: {app: claude-api}}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: claude-api, labels: {app: claude-api, app.kubernetes.io/part-of: custom-remote}}
    spec:
      replicas: 1
      strategy: {type: Recreate}
      selector: {matchLabels: {app: claude-api}}
      template:
        metadata: {labels: {app: claude-api}}
        spec:
          containers:
            - name: api
              image: ${IMAGE}
              imagePullPolicy: IfNotPresent   # sideload.sh loads the per-commit tag onto the node.
              ports: [{containerPort: 8787, name: http}]
              env:
                - {name: REMOTE_ALLOWED_HOSTS, value: "${API_HOST},${PUBLIC_API_HOST},claude-api"}
                - {name: REMOTE_PUBLIC_URL, value: "https://${PUBLIC_API_HOST}"}
                - {name: REMOTE_HTTPS, value: "1"}
                - {name: REMOTE_OAI_MODEL, value: "${DEFAULT_MODEL}"}
                - {name: REMOTE_OIDC_ISSUER, value: "${OIDC_ISSUER}"}
                - {name: REMOTE_OIDC_CLIENT_ID, value: "${OIDC_CLIENT_ID}"}
                - {name: REMOTE_ADMIN_EMAILS, value: "${ADMIN_EMAILS}"}
                - {name: REMOTE_ADMIN_GROUPS, value: "${ADMIN_GROUPS}"}
                - name: REMOTE_OIDC_CLIENT_SECRET
                  valueFrom: {secretKeyRef: {name: custom-remote, key: oidc-client-secret}}
                - name: REMOTE_TOKEN
                  valueFrom: {secretKeyRef: {name: custom-remote, key: remote-token}}
                - name: REMOTE_SESSION_SECRET
                  valueFrom: {secretKeyRef: {name: custom-remote, key: session-secret}}
                # /v1 accepts revocable keys only; master-token console recovery remains available.
                - {name: REMOTE_V1_ALLOW_MASTER, value: "0"}
                - {name: REMOTE_USER_RATE, value: "${USER_RATE}"}
                - {name: REMOTE_MAX_CONCURRENCY, value: "${MAX_CONCURRENCY}"}
                - {name: REMOTE_FORWARDER_KEY_NAME, value: "open-webui,litellm"}
                - name: REMOTE_FORWARD_JWT_SECRET
                  valueFrom: {secretKeyRef: {name: custom-remote, key: forward-jwt-secret}}
              volumeMounts: [{name: data, mountPath: /data}]
              readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
              livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30, failureThreshold: 5}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 1536Mi}
          volumes: [{name: data, persistentVolumeClaim: {claimName: claude-api-data}}]
  - apiVersion: v1
    kind: Service
    metadata: {name: claude-api, labels: {app: claude-api}}
    spec:
      selector: {app: claude-api}
      ports: [{name: http, port: 8787, targetPort: http}]
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: claude-api
      labels: {app: claude-api}
      annotations: {haproxy.router.openshift.io/timeout: 600s}
    spec:
      host: ${API_HOST}
      to: {kind: Service, name: claude-api}
      port: {targetPort: http}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}

  # ---------- Open WebUI ----------
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: open-webui-data, labels: {app: open-webui}}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 5Gi}}
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: open-webui, labels: {app: open-webui, app.kubernetes.io/part-of: custom-remote}}
    spec:
      replicas: 1
      strategy: {type: Recreate}
      selector: {matchLabels: {app: open-webui}}
      template:
        metadata: {labels: {app: open-webui}}
        spec:
          containers:
            - name: open-webui
              image: ${OPENWEBUI_IMAGE}
              ports: [{containerPort: 8080, name: http}]
              env:
                - {name: WEBUI_URL, value: "https://${PUBLIC_CHAT_HOST}"}
                - {name: CORS_ALLOW_ORIGIN, value: "https://${PUBLIC_CHAT_HOST}"}
                - {name: DATA_DIR, value: /app/backend/data}
                - {name: HOME, value: /app/backend/data/home}
                - {name: ENABLE_OLLAMA_API, value: "False"}
                - {name: OPENAI_API_BASE_URL, value: "http://claude-api:8787/v1"}
                - name: OPENAI_API_KEY          # Dedicated revocable sk-cr key, not the master token
                  valueFrom: {secretKeyRef: {name: custom-remote, key: owui-api-key}}
                - {name: ENABLE_PERSISTENT_CONFIG, value: "False"}   # Environment is authoritative at startup.
                - {name: ENABLE_FORWARD_USER_INFO_HEADERS, value: "True"}
                - name: FORWARD_USER_INFO_HEADER_JWT_SECRET  # Signed identity for per-user limits
                  valueFrom: {secretKeyRef: {name: custom-remote, key: forward-jwt-secret}}
                - {name: TASK_MODEL_EXTERNAL, value: "${TASK_MODEL}"}
                - {name: DEFAULT_MODELS, value: "${DEFAULT_MODEL}"}
                - {name: ENABLE_EVALUATION_ARENA_MODELS, value: "False"}
                # OIDC-only login; ACCESS_ROLE grants access, ADMIN_ROLE grants administration.
                - {name: ENABLE_OAUTH_SIGNUP, value: "True"}
                - {name: ENABLE_SIGNUP, value: "False"}
                - {name: ENABLE_OAUTH_ROLE_MANAGEMENT, value: "True"}
                - {name: OAUTH_ROLES_CLAIM, value: "${ROLES_CLAIM}"}
                - {name: OAUTH_ALLOWED_ROLES, value: "${ACCESS_ROLE}"}
                - {name: OAUTH_ADMIN_ROLES, value: "${ADMIN_ROLE}"}
                - {name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL, value: "True"}
                - {name: ENABLE_LOGIN_FORM, value: "False"}
                - {name: ENABLE_PASSWORD_AUTH, value: "False"}
                - {name: DEFAULT_USER_ROLE, value: pending}
                - {name: OAUTH_PROVIDER_NAME, value: "${OIDC_PROVIDER_NAME}"}
                - {name: OPENID_PROVIDER_URL, value: "${OIDC_ISSUER}/.well-known/openid-configuration"}
                - {name: OPENID_REDIRECT_URI, value: "https://${PUBLIC_CHAT_HOST}/oauth/oidc/callback"}
                - {name: OAUTH_CLIENT_ID, value: "${OIDC_CLIENT_ID}"}
                - name: OAUTH_CLIENT_SECRET
                  valueFrom: {secretKeyRef: {name: custom-remote, key: oidc-client-secret}}
                - {name: OAUTH_SCOPES, value: "openid email profile"}
                - {name: OAUTH_CODE_CHALLENGE_METHOD, value: S256}
                - name: WEBUI_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: custom-remote, key: webui-secret-key}}
              volumeMounts: [{name: data, mountPath: /app/backend/data}]
              readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 30}
              livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 120, periodSeconds: 30, failureThreshold: 5}
              resources:
                requests: {cpu: 100m, memory: 768Mi}
                limits: {memory: 2Gi}
          volumes: [{name: data, persistentVolumeClaim: {claimName: open-webui-data}}]
  - apiVersion: v1
    kind: Service
    metadata: {name: open-webui, labels: {app: open-webui}}
    spec:
      selector: {app: open-webui}
      ports: [{name: http, port: 8080, targetPort: http}]
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: open-webui
      labels: {app: open-webui}
      annotations: {haproxy.router.openshift.io/timeout: 600s}
    spec:
      host: ${CHAT_HOST}
      to: {kind: Service, name: open-webui}
      port: {targetPort: http}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}

  # ---------- LiteLLM ----------
  - apiVersion: v1
    kind: ConfigMap
    metadata: {name: litellm-config, labels: {app: litellm}}
    data:
      config.yaml: |
        # Gateway models use a dedicated revocable sk-cr key.
        # LiteLLM is another /v1 client, subject to the same limits as Open WebUI.
        # Add external providers (OpenAI, Gemini, Mistral…) through the UI;
        # database persistence avoids redeployment.
        model_list:
          - model_name: opus
            litellm_params:
              model: openai/opus
              api_base: os.environ/CLAUDE_API_BASE
              api_key: os.environ/CLAUDE_API_KEY
          - model_name: sonnet
            litellm_params:
              model: openai/sonnet
              api_base: os.environ/CLAUDE_API_BASE
              api_key: os.environ/CLAUDE_API_KEY
          - model_name: haiku
            litellm_params:
              model: openai/haiku
              api_base: os.environ/CLAUDE_API_BASE
              api_key: os.environ/CLAUDE_API_KEY
          - model_name: fable
            litellm_params:
              model: openai/fable
              api_base: os.environ/CLAUDE_API_BASE
              api_key: os.environ/CLAUDE_API_KEY
        litellm_settings:
          drop_params: true        # the gateway ignores temperature / top_p / max_tokens
          request_timeout: 600
          num_retries: 0           # The gateway already handles account failover.
        general_settings:
          forward_client_headers_to_llm_api: true   # laisse passer x-openwebui-user-jwt
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: litellm-db-data, labels: {app: litellm-db}}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 2Gi}}
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: litellm-db, labels: {app: litellm-db, app.kubernetes.io/part-of: custom-remote}}
    spec:
      replicas: 1
      strategy: {type: Recreate}
      selector: {matchLabels: {app: litellm-db}}
      template:
        metadata: {labels: {app: litellm-db}}
        spec:
          containers:
            - name: postgres
              image: ${POSTGRES_IMAGE}
              ports: [{containerPort: 5432, name: postgres}]
              env:
                - {name: POSTGRESQL_USER, value: litellm}
                - {name: POSTGRESQL_DATABASE, value: litellm}
                - name: POSTGRESQL_PASSWORD
                  valueFrom: {secretKeyRef: {name: custom-remote, key: litellm-db-password}}
              volumeMounts: [{name: data, mountPath: /var/lib/pgsql/data}]
              readinessProbe: {exec: {command: [/usr/libexec/check-container]}, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 30}
              livenessProbe: {tcpSocket: {port: postgres}, initialDelaySeconds: 120, periodSeconds: 30, failureThreshold: 5}
              resources:
                requests: {cpu: 25m, memory: 128Mi}
                limits: {memory: 512Mi}
          volumes: [{name: data, persistentVolumeClaim: {claimName: litellm-db-data}}]
  - apiVersion: v1
    kind: Service
    metadata: {name: litellm-db, labels: {app: litellm-db}}
    spec:
      selector: {app: litellm-db}
      ports: [{name: postgres, port: 5432, targetPort: postgres}]
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: litellm, labels: {app: litellm, app.kubernetes.io/part-of: custom-remote}}
    spec:
      replicas: 1
      strategy: {type: Recreate}
      selector: {matchLabels: {app: litellm}}
      template:
        metadata: {labels: {app: litellm}}
        spec:
          containers:
            - name: litellm
              image: ${LITELLM_IMAGE}
              args: ["--config", "/app/config/config.yaml", "--port", "4000"]
              ports: [{containerPort: 4000, name: http}]
              env:
                - {name: CLAUDE_API_BASE, value: "http://claude-api:8787/v1"}
                - name: CLAUDE_API_KEY            # Dedicated sk-cr key, like Open WebUI
                  valueFrom: {secretKeyRef: {name: custom-remote, key: litellm-api-key}}
                - name: LITELLM_MASTER_KEY        # Master key and UI password for admin
                  valueFrom: {secretKeyRef: {name: custom-remote, key: litellm-master-key}}
                - name: LITELLM_SALT_KEY          # Encrypts stored provider keys; never change it.
                  valueFrom: {secretKeyRef: {name: custom-remote, key: litellm-salt-key}}
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: custom-remote, key: litellm-database-url}}
                - {name: STORE_MODEL_IN_DB, value: "True"}   # Persist models added through the UI.
                # Use the public UI URL to build the SSO redirect_uri
                # at <base>/sso/callback and post-login redirects.
                - {name: PROXY_BASE_URL, value: "https://${PUBLIC_LITELLM_HOST}"}
                # The router terminates TLS: trust its X-Forwarded-Proto header.
                - {name: FORWARDED_ALLOW_IPS, value: "*"}
                # OIDC SSO shares the console/Open WebUI Keycloak client. Free for up to
                # five database users; additional users require a LiteLLM enterprise license.
                - {name: GENERIC_CLIENT_ID, value: "${OIDC_CLIENT_ID}"}
                - name: GENERIC_CLIENT_SECRET
                  valueFrom: {secretKeyRef: {name: custom-remote, key: oidc-client-secret}}
                - {name: GENERIC_AUTHORIZATION_ENDPOINT, value: "${OIDC_ISSUER}/protocol/openid-connect/auth"}
                - {name: GENERIC_TOKEN_ENDPOINT, value: "${OIDC_ISSUER}/protocol/openid-connect/token"}
                - {name: GENERIC_USERINFO_ENDPOINT, value: "${OIDC_ISSUER}/protocol/openid-connect/userinfo"}
                - {name: GENERIC_SCOPE, value: "openid email profile"}
                - {name: GENERIC_INCLUDE_TOKEN_CLAIMS, value: "true"}   # Roles may appear only in tokens.
                - {name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM, value: "${ROLES_CLAIM}"}
                - {name: GENERIC_ROLE_MAPPINGS_ROLES, value: '{"proxy_admin": ["${ADMIN_ROLE}"], "internal_user": ["${ACCESS_ROLE}"]}'}
                - {name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE, value: internal_user_viewer}   # Read-only without a role.
                # Arbitrary UID under restricted SCC: write Prisma data and caches to /tmp.
                - {name: HOME, value: /tmp}
                - {name: PRISMA_BINARY_CACHE_DIR, value: /tmp/prisma}
              volumeMounts:
                - {name: config, mountPath: /app/config}
                - {name: tmp, mountPath: /tmp}
              readinessProbe: {httpGet: {path: /health/readiness, port: http}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 60}
              livenessProbe: {httpGet: {path: /health/liveliness, port: http}, initialDelaySeconds: 180, periodSeconds: 30, failureThreshold: 5}
              resources:
                requests: {cpu: 50m, memory: 512Mi}
                limits: {memory: 1536Mi}
          volumes:
            - {name: config, configMap: {name: litellm-config}}
            - {name: tmp, emptyDir: {}}
  - apiVersion: v1
    kind: Service
    metadata: {name: litellm, labels: {app: litellm}}
    spec:
      selector: {app: litellm}
      ports: [{name: http, port: 4000, targetPort: http}]
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: litellm
      labels: {app: litellm}
      annotations: {haproxy.router.openshift.io/timeout: 600s}
    spec:
      host: ${LITELLM_HOST}
      to: {kind: Service, name: litellm}
      port: {targetPort: http}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}

  # ---------- network: only the router, Open WebUI and LiteLLM can reach pods ----------
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: claude-api-ingress}
    spec:
      podSelector: {matchLabels: {app: claude-api}}
      policyTypes: [Ingress]
      ingress:
        - from: [{podSelector: {matchLabels: {app: open-webui}}}]
        - from: [{podSelector: {matchLabels: {app: litellm}}}]
        - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}}]
        - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/host-network: ""}}}]
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: open-webui-ingress}
    spec:
      podSelector: {matchLabels: {app: open-webui}}
      policyTypes: [Ingress]
      ingress:
        - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}}]
        - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/host-network: ""}}}]
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: litellm-ingress}
    spec:
      podSelector: {matchLabels: {app: litellm}}
      policyTypes: [Ingress]
      ingress:
        - from: [{podSelector: {matchLabels: {app: open-webui}}}]
        - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}}]
        # Host-network router and oc port-forward connections originate from the node.
        - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/host-network: ""}}}]
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: litellm-db-ingress}
    spec:
      podSelector: {matchLabels: {app: litellm-db}}
      policyTypes: [Ingress]
      ingress:
        - from: [{podSelector: {matchLabels: {app: litellm}}}]
