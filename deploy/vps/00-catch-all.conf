# Close unknown-host and direct-IP connections without falling through to another site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # certbot retains control
    location / { return 444; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # nginx 1.18 lacks ssl_reject_handshake; use a neutral self-signed certificate.
    ssl_certificate     /etc/nginx/certs/catch-all.crt;
    ssl_certificate_key /etc/nginx/certs/catch-all.key;
    return 444;
}
