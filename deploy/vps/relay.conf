# Public relay proxy to the OKD cluster through NetBird.
# Public  : https://relay.example.test      → Open WebUI  (internal relay.apps.cluster.example.test)
#           https://relay-api.example.test  → console /admin + API /v1 (internal relay-api.apps.cluster.example.test)
# Repository: als0m3/custom-remote, deploy/vps/.
limit_req_zone $binary_remote_addr zone=relay_wan:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.test relay-api.example.test;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.example.test;

    ssl_certificate     /etc/letsencrypt/live/relay.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.test/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;           # Open WebUI attachments
    limit_req zone=relay_wan burst=60 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/relay.access.log;
    error_log  /var/log/nginx/relay.error.log;

    location / {
        proxy_pass https://192.0.2.10;
        proxy_ssl_server_name on;
        proxy_ssl_name relay.apps.cluster.example.test;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/certs/okd-ingress-ca.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host              relay.apps.cluster.example.test;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;      # websocket (socket.io)
        proxy_set_header Connection        $connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;                                   # Streaming responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay-api.example.test;

    ssl_certificate     /etc/letsencrypt/live/relay.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.test/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30m;           # Base64 images / PDFs on /v1
    limit_req zone=relay_wan burst=60 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/relay-api.access.log;
    error_log  /var/log/nginx/relay-api.error.log;

    location / {
        proxy_pass https://192.0.2.10;
        proxy_ssl_server_name on;
        proxy_ssl_name relay-api.apps.cluster.example.test;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/certs/okd-ingress-ca.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host              relay-api.apps.cluster.example.test;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_buffering off;                                   # API and console SSE streams
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
