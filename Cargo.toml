[package]
name = "customremote"
version = "0.3.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Standalone OpenAI-compatible gateway and AI account console"

[dependencies]
flate2 = "1"
tar = "0.4"
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
deunicode = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
scrypt = "0.11"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
